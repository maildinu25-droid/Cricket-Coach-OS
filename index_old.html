<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#174c3c"/>
<title>CoachBook Pro</title>
<style>
:root{--g:#174c3c;--g2:#246b55;--mint:#edf6f2;--ink:#18211e;--muted:#6d7773;--line:#dfe7e3;--bg:#f5f7f6;--white:#fff;--red:#a23b3b;--amber:#9a6a13;--shadow:0 8px 30px rgba(20,55,44,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit}.app{min-height:100vh}.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);height:66px;display:flex;align-items:center;padding:0 18px;gap:12px}
.brand{font-weight:800;color:var(--g);font-size:20px}.brand small{display:block;color:var(--muted);font-weight:500;font-size:10px;letter-spacing:.7px;text-transform:uppercase}
.menuBtn{display:none;border:0;background:var(--mint);border-radius:10px;padding:9px 11px}.layout{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 66px)}
aside{background:#fff;border-right:1px solid var(--line);padding:18px 12px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;padding:12px 13px;border-radius:10px;color:#45504c;cursor:pointer}.nav button.active,.nav button:hover{background:var(--mint);color:var(--g);font-weight:700}
main{padding:26px;max-width:1280px;width:100%;margin:auto}.page{display:none}.page.active{display:block}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}.hero h1{margin:0 0 6px;font-size:29px}.muted{color:var(--muted)}
.btn{border:0;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:700}.primary{background:var(--g);color:#fff}.secondary{background:var(--mint);color:var(--g)}.danger{background:#f9eaea;color:var(--red)}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.stat b{display:block;font-size:27px;color:var(--g);margin-top:7px}.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:25px 0 12px}.sectionTitle h2{font-size:18px;margin:0}.quick{cursor:pointer}.quick:hover{border-color:#8eb6a7;transform:translateY(-1px)}.quick b{color:var(--g);display:block;margin-bottom:5px}
.list{display:grid;gap:9px}.item{border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;justify-content:space-between;gap:12px;align-items:center}.item strong{display:block}.tag{font-size:11px;padding:5px 8px;background:var(--mint);color:var(--g);border-radius:999px;white-space:nowrap}
.empty{text-align:center;padding:32px;color:var(--muted);border:1px dashed #cad6d1;border-radius:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.search{min-width:220px}
input,textarea,select{width:100%;border:1px solid #ccd7d2;background:#fff;border-radius:10px;padding:11px 12px;outline:none}input:focus,textarea:focus,select:focus{border-color:#6a9d89;box-shadow:0 0 0 3px #e6f2ed}textarea{min-height:100px;resize:vertical}
label{display:grid;gap:6px;font-size:13px;font-weight:650;color:#45504c}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:rgba(13,29,24,.48);z-index:50;display:none;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:22px}.sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.sheetHead h2{margin:0}.x{border:0;background:#eef2f0;border-radius:50%;width:36px;height:36px;cursor:pointer}
.rating{display:grid;grid-template-columns:1fr 90px;gap:10px;align-items:center;margin-bottom:9px}.playerTop{display:flex;gap:14px;align-items:center}.avatar{width:46px;height:46px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:800}.bar{height:8px;background:#e9efec;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.fab{position:fixed;right:22px;bottom:22px;width:56px;height:56px;border-radius:50%;border:0;background:var(--g);color:#fff;font-size:27px;box-shadow:0 10px 25px rgba(23,76,60,.28);cursor:pointer;z-index:30}
@media(max-width:850px){.layout{grid-template-columns:1fr}aside{position:fixed;z-index:40;left:-260px;top:66px;bottom:0;width:250px;transition:.2s;box-shadow:var(--shadow)}aside.open{left:0}.menuBtn{display:block}.g4,.g3{grid-template-columns:repeat(2,1fr)}main{padding:18px}.hero{flex-direction:column}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
@media(max-width:520px){.g4,.g3,.g2{grid-template-columns:1fr}.top{height:62px}.layout{min-height:calc(100vh - 62px)}main{padding:15px}.hero h1{font-size:25px}.card{padding:15px}.search{min-width:100%}}
@media print{aside,.top,.fab,.btn,.toolbar{display:none!important}.layout{display:block}main{padding:0}.page{display:none!important}.page.active{display:block!important}.card{box-shadow:none}}
</style>
</head>
<body>
<div class="app">
<header class="top"><button class="menuBtn" onclick="toggleMenu()">☰</button><div class="brand">CoachBook Pro<small>Professional Cricket Coaching</small></div></header>
<div class="layout">
<aside id="side"><nav class="nav" id="nav"></nav></aside>
<main>
<section id="dashboard" class="page active"></section>
<section id="sessions" class="page"></section>
<section id="reflections" class="page"></section>
<section id="players" class="page"></section>
<section id="assessments" class="page"></section>
<section id="drills" class="page"></section>
<section id="matches" class="page"></section>
<section id="reports" class="page"></section>
</main></div>
<button class="fab" onclick="openQuick()">+</button>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const pages=[["dashboard","Dashboard"],["sessions","Session Plans"],["reflections","Self Reflections"],["players","Players"],["assessments","Assessments"],["drills","Drill Library"],["matches","Match Notes"],["reports","Reports & Backup"]];
const seedDrills=[
{name:"High Catch Pressure Circle",cat:"Catching",players:"6–12",duration:"15 min",points:"Early call, balanced base, attack the ball, secure finish."},
{name:"Rapid Ground Fielding",cat:"Ground Fielding",players:"6–10",duration:"12 min",points:"Low approach, soft hands, quick transfer, accurate release."},
{name:"Boundary Relay Challenge",cat:"Boundary",players:"8–16",duration:"15 min",points:"Communication, clean pickup, relay alignment, flat throw."},
{name:"Direct Hit Competition",cat:"Throwing",players:"6–14",duration:"12 min",points:"Gather under control, align feet, quick release, hit one stump."}
];
let db=JSON.parse(localStorage.getItem("coachbook"))||{sessions:[],reflections:[],players:[],assessments:[],matches:[],drills:seedDrills};
const save=()=>{localStorage.setItem("coachbook",JSON.stringify(db));renderAll()};
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const today=()=>new Date().toISOString().slice(0,10);
function nav(){document.getElementById("nav").innerHTML=pages.map(([id,n],i)=>`<button class="${i?'':'active'}" onclick="go('${id}',this)">${n}</button>`).join("")}
function go(id,b){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));if(b)b.classList.add("active");document.getElementById("side").classList.remove("open")}
function toggleMenu(){document.getElementById("side").classList.toggle("open")}
function modal(html){document.getElementById("sheet").innerHTML=html;document.getElementById("modal").classList.add("open")}
function closeM(){document.getElementById("modal").classList.remove("open")}
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeM()}
function head(title,sub,action=""){return `<div class="hero"><div><h1>${title}</h1><div class="muted">${sub}</div></div>${action}</div>`}
function empty(t){return `<div class="empty">${t}</div>`}
function del(type,i){if(confirm("Delete this entry?")){db[type].splice(i,1);save()}}
function dashboard(){
let hrs=db.sessions.reduce((a,s)=>a+(Number(s.duration)||0),0)/60;
let recent=db.sessions.slice(-3).reverse();
document.getElementById("dashboard").innerHTML=head("Coaching Dashboard","Your professional coaching workspace.",`<button class="btn primary" onclick="newSession()">+ Plan Session</button>`)+
`<div class="grid g4">
<div class="card stat"><span>Sessions</span><b>${db.sessions.length}</b></div>
<div class="card stat"><span>Coaching Hours</span><b>${hrs.toFixed(1)}</b></div>
<div class="card stat"><span>Players</span><b>${db.players.length}</b></div>
<div class="card stat"><span>Reflections</span><b>${db.reflections.length}</b></div></div>
<div class="sectionTitle"><h2>Quick actions</h2></div><div class="grid g4">
<div class="card quick" onclick="newSession()"><b>Session Plan</b><span class="muted">Plan objectives, blocks and coaching cues.</span></div>
<div class="card quick" onclick="newReflection()"><b>Reflection</b><span class="muted">Capture learning immediately after coaching.</span></div>
<div class="card quick" onclick="newPlayer()"><b>Add Player</b><span class="muted">Build your player development database.</span></div>
<div class="card quick" onclick="newAssessment()"><b>Assessment</b><span class="muted">Rate skills and record development priorities.</span></div></div>
<div class="sectionTitle"><h2>Recent sessions</h2></div><div class="card">${recent.length?`<div class="list">${recent.map(s=>`<div class="item"><div><strong>${esc(s.title)}</strong><small class="muted">${esc(s.date)} · ${esc(s.squad||"Squad")}</small></div><span class="tag">${esc(s.focus||"Session")}</span></div>`).join("")}</div>`:empty("Your recent session plans will appear here.")}</div>`;
}
function sessions(){
document.getElementById("sessions").innerHTML=head("Session Plans","Plan, document and review every coaching session.",`<button class="btn primary" onclick="newSession()">+ New Session</button>`)+
`<div class="card">${db.sessions.length?`<div class="list">${db.sessions.slice().reverse().map((s,r)=>{let i=db.sessions.length-1-r;return `<div class="item"><div><strong>${esc(s.title)}</strong><div class="muted">${esc(s.date)} · ${esc(s.squad)} · ${esc(s.duration)} min</div><small>${esc(s.objectives)}</small></div><div class="toolbar"><span class="tag">${esc(s.focus)}</span><button class="btn secondary" onclick="viewSession(${i})">View</button><button class="btn danger" onclick="del('sessions',${i})">×</button></div></div>`}).join("")}</div>`:empty("No session plans yet. Create your first professional plan.")}</div>`;
}
function newSession(){
modal(`<div class="sheetHead"><h2>New Session Plan</h2><button class="x" onclick="closeM()">×</button></div><form onsubmit="addSession(event)" class="formgrid">
<label>Date<input name="date" type="date" value="${today()}" required></label><label>Session title<input name="title" placeholder="U16 Fielding – Match Preparation" required></label>
<label>Squad / Group<input name="squad" placeholder="Senior / U16 / Academy"></label><label>Duration (minutes)<input name="duration" type="number" value="90"></label>
<label>Primary focus<select name="focus"><option>Fielding</option><option>Batting</option><option>Bowling</option><option>Wicketkeeping</option><option>Team</option><option>Fitness</option></select></label><label>Venue<input name="venue" placeholder="Ground / Nets"></label>
<label class="full">Session objectives<textarea name="objectives" placeholder="What should players achieve?"></textarea></label>
<label class="full">Warm-up / Preparation<textarea name="warmup" placeholder="Movement preparation, activation, ball familiarisation..."></textarea></label>
<label class="full">Main Skill Block<textarea name="main" placeholder="Drills, duration, organisation, coaching points..."></textarea></label>
<label class="full">Competitive / Game Block<textarea name="game" placeholder="Scenario, rules, scoring and constraints..."></textarea></label>
<label class="full">Key Coaching Cues<textarea name="cues" placeholder="Simple cues you want to reinforce..."></textarea></label>
<label class="full">Success Criteria<textarea name="success" placeholder="How will you know the session worked?"></textarea></label>
<div class="full toolbar"><button class="btn primary">Save Session</button><button type="button" class="btn secondary" onclick="closeM()">Cancel</button></div></form>`)
}
function addSession(e){e.preventDefault();db.sessions.push(Object.fromEntries(new FormData(e.target)));closeM();save()}
function viewSession(i){let s=db.sessions[i];modal(`<div class="sheetHead"><h2>${esc(s.title)}</h2><button class="x" onclick="closeM()">×</button></div>
<div class="grid g2"><div class="card"><b>Date</b><div>${esc(s.date)}</div></div><div class="card"><b>Squad</b><div>${esc(s.squad)}</div></div></div>
${[["Objectives",s.objectives],["Warm-up",s.warmup],["Main Skill Block",s.main],["Competitive / Game Block",s.game],["Coaching Cues",s.cues],["Success Criteria",s.success]].map(x=>`<div class="sectionTitle"><h2>${x[0]}</h2></div><div class="card">${esc(x[1]||"—").replace(/\n/g,"<br>")}</div>`).join("")}<div class="toolbar" style="margin-top:18px"><button class="btn primary" onclick="window.print()">Print / Save PDF</button></div>`)}
function reflections(){
document.getElementById("reflections").innerHTML=head("Self Reflections","Turn experience into deliberate coaching improvement.",`<button class="btn primary" onclick="newReflection()">+ New Reflection</button>`)+
`<div class="card">${db.reflections.length?`<div class="list">${db.reflections.slice().reverse().map((x,r)=>{let i=db.reflections.length-1-r;return `<div class="item"><div><strong>${esc(x.date)} · ${esc(x.session||"Coaching Reflection")}</strong><div class="muted">Session rating ${esc(x.rating)}/5</div><small>${esc(x.well)}</small></div><button class="btn danger" onclick="del('reflections',${i})">×</button></div>`}).join("")}</div>`:empty("No reflections yet.")}</div>`;
}
function newReflection(){modal(`<div class="sheetHead"><h2>Coach Self Reflection</h2><button class="x" onclick="closeM()">×</button></div><form onsubmit="addReflection(event)" class="formgrid">
<label>Date<input name="date" type="date" value="${today()}" required></label><label>Session / Group<input name="session"></label>
<label>Overall rating<select name="rating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label>Communication rating<select name="communication"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label>
<label class="full">What went well?<textarea name="well"></textarea></label><label class="full">What could have been better?<textarea name="better"></textarea></label>
<label class="full">What did I learn about the players?<textarea name="players"></textarea></label><label class="full">What will I change next time?<textarea name="change"></textarea></label>
<label class="full">Next session focus<textarea name="next"></textarea></label><div class="full"><button class="btn primary">Save Reflection</button></div></form>`)}
function addReflection(e){e.preventDefault();db.reflections.push(Object.fromEntries(new FormData(e.target)));closeM();save()}
function players(){
document.getElementById("players").innerHTML=head("Players","A simple development record for every player.",`<button class="btn primary" onclick="newPlayer()">+ Add Player</button>`)+
`<div class="grid g3">${db.players.length?db.players.map((p,i)=>`<div class="card"><div class="playerTop"><div class="avatar">${esc((p.name||"?").split(" ").map(x=>x[0]).slice(0,2).join(""))}</div><div><strong>${esc(p.name)}</strong><div class="muted">${esc(p.role||"Player")} · ${esc(p.group||"Squad")}</div></div></div><hr style="border:0;border-top:1px solid var(--line);margin:15px 0"><small class="muted">Current focus</small><div>${esc(p.focus||"—")}</div><div class="toolbar" style="margin-top:14px"><button class="btn secondary" onclick="playerView(${i})">Profile</button><button class="btn danger" onclick="del('players',${i})">×</button></div></div>`).join(""):empty("Add players to begin building your development database.")}</div>`;
}
function newPlayer(){modal(`<div class="sheetHead"><h2>Add Player</h2><button class="x" onclick="closeM()">×</button></div><form onsubmit="addPlayer(event)" class="formgrid">
<label>Player name<input name="name" required></label><label>Squad / Group<input name="group"></label><label>Role<input name="role" placeholder="Batter / Bowler / WK / All-rounder"></label><label>Age<input name="age" type="number"></label>
<label class="full">Strengths<textarea name="strengths"></textarea></label><label class="full">Development areas<textarea name="areas"></textarea></label><label class="full">Current focus / goal<textarea name="focus"></textarea></label><label class="full">Coach notes<textarea name="notes"></textarea></label><div class="full"><button class="btn primary">Save Player</button></div></form>`)}
function addPlayer(e){e.preventDefault();db.players.push(Object.fromEntries(new FormData(e.target)));closeM();save()}
function playerView(i){let p=db.players[i], aa=db.assessments.filter(a=>a.player===p.name).slice(-1)[0];modal(`<div class="sheetHead"><h2>${esc(p.name)}</h2><button class="x" onclick="closeM()">×</button></div><div class="grid g2"><div class="card"><b>Role</b><div>${esc(p.role)}</div></div><div class="card"><b>Squad</b><div>${esc(p.group)}</div></div></div>${[["Strengths",p.strengths],["Development Areas",p.areas],["Current Goal",p.focus],["Coach Notes",p.notes]].map(x=>`<div class="sectionTitle"><h2>${x[0]}</h2></div><div class="card">${esc(x[1]||"—")}</div>`).join("")}${aa?`<div class="sectionTitle"><h2>Latest assessment</h2></div><div class="card">Overall: <b>${assessmentAvg(aa)}/10</b> · ${esc(aa.date)}</div>`:""}`)}
function assessments(){
document.getElementById("assessments").innerHTML=head("Player Assessments","Track technical, physical and behavioural development.",`<button class="btn primary" onclick="newAssessment()">+ New Assessment</button>`)+
`<div class="card">${db.assessments.length?`<div class="list">${db.assessments.slice().reverse().map((a,r)=>{let i=db.assessments.length-1-r;return `<div class="item"><div><strong>${esc(a.player)}</strong><div class="muted">${esc(a.date)} · Overall ${assessmentAvg(a)}/10</div><small>${esc(a.priority)}</small></div><button class="btn danger" onclick="del('assessments',${i})">×</button></div>`}).join("")}</div>`:empty("Create a player assessment after adding players.")}</div>`;
}
const skills=["Catching","Ground Fielding","Throwing Accuracy","Movement","Game Awareness","Communication","Decision Making","Work Ethic","Coachability"];
function newAssessment(){if(!db.players.length){alert("Add a player first.");return}modal(`<div class="sheetHead"><h2>Player Assessment</h2><button class="x" onclick="closeM()">×</button></div><form onsubmit="addAssessment(event)">
<div class="formgrid"><label>Player<select name="player">${db.players.map(p=>`<option>${esc(p.name)}</option>`).join("")}</select></label><label>Date<input type="date" name="date" value="${today()}"></label></div>
<div class="sectionTitle"><h2>Rate 1–10</h2></div>${skills.map((s,i)=>`<div class="rating"><label>${s}</label><input name="s${i}" type="number" min="1" max="10" value="5"></div>`).join("")}
<label>Key development priority<textarea name="priority"></textarea></label><label style="margin-top:12px">Coach comments<textarea name="comments"></textarea></label><button class="btn primary" style="margin-top:15px">Save Assessment</button></form>`)}
function addAssessment(e){e.preventDefault();db.assessments.push(Object.fromEntries(new FormData(e.target)));closeM();save()}
function assessmentAvg(a){let nums=skills.map((_,i)=>Number(a["s"+i]||0));return (nums.reduce((x,y)=>x+y,0)/nums.length).toFixed(1)}
function drills(){
document.getElementById("drills").innerHTML=head("Drill Library","Keep your best coaching practices organised and reusable.",`<button class="btn primary" onclick="newDrill()">+ Add Drill</button>`)+
`<div class="grid g2">${db.drills.map((d,i)=>`<div class="card"><span class="tag">${esc(d.cat)}</span><h3>${esc(d.name)}</h3><div class="muted">${esc(d.players)} · ${esc(d.duration)}</div><p>${esc(d.points)}</p><button class="btn danger" onclick="del('drills',${i})">Delete</button></div>`).join("")}</div>`;
}
function newDrill(){modal(`<div class="sheetHead"><h2>Add Drill</h2><button class="x" onclick="closeM()">×</button></div><form onsubmit="addDrill(event)" class="formgrid"><label>Drill name<input name="name" required></label><label>Category<input name="cat" placeholder="Catching / Throwing / Batting..."></label><label>Players<input name="players"></label><label>Duration<input name="duration"></label><label class="full">Organisation & coaching points<textarea name="points"></textarea></label><div class="full"><button class="btn primary">Save Drill</button></div></form>`)}
function addDrill(e){e.preventDefault();db.drills.push(Object.fromEntries(new FormData(e.target)));closeM();save()}
function matches(){
document.getElementById("matches").innerHTML=head("Match Notes","Capture observations, fielding events and action points.",`<button class="btn primary" onclick="newMatch()">+ Match Note</button>`)+`<div class="card">${db.matches.length?`<div class="list">${db.matches.slice().reverse().map((m,r)=>{let i=db.matches.length-1-r;return `<div class="item"><div><strong>${esc(m.team)} vs ${esc(m.opp)}</strong><div class="muted">${esc(m.date)} · Fielding ${esc(m.rating)}/10</div><small>${esc(m.actions)}</small></div><button class="btn danger" onclick="del('matches',${i})">×</button></div>`}).join("")}</div>`:empty("No match observations recorded.")}</div>`;
}
function newMatch(){modal(`<div class="sheetHead"><h2>Match Observation</h2><button class="x" onclick="closeM()">×</button></div><form onsubmit="addMatch(event)" class="formgrid"><label>Date<input name="date" type="date" value="${today()}"></label><label>Your team<input name="team"></label><label>Opposition<input name="opp"></label><label>Fielding rating /10<input name="rating" type="number" min="1" max="10" value="7"></label><label>Chances taken<input name="taken" type="number"></label><label>Chances missed<input name="missed" type="number"></label><label>Run outs<input name="runouts" type="number"></label><label>Misfields<input name="misfields" type="number"></label><label class="full">Key observations<textarea name="notes"></textarea></label><label class="full">Action items for training<textarea name="actions"></textarea></label><div class="full"><button class="btn primary">Save Match Note</button></div></form>`)}
function addMatch(e){e.preventDefault();db.matches.push(Object.fromEntries(new FormData(e.target)));closeM();save()}
function reports(){
let avg=db.assessments.length?(db.assessments.reduce((s,a)=>s+Number(assessmentAvg(a)),0)/db.assessments.length).toFixed(1):"—";
let hrs=db.sessions.reduce((a,s)=>a+(Number(s.duration)||0),0)/60;
document.getElementById("reports").innerHTML=head("Professional Reports","Generate polished reports from the information you already enter in CoachBook Pro.")+
`<div class="grid g4"><div class="card stat"><span>Sessions</span><b>${db.sessions.length}</b></div><div class="card stat"><span>Coaching Hours</span><b>${hrs.toFixed(1)}</b></div><div class="card stat"><span>Assessments</span><b>${db.assessments.length}</b></div><div class="card stat"><span>Avg Assessment</span><b>${avg}</b></div></div>
<div class="sectionTitle"><h2>Generate Report</h2></div><div class="grid g3">
<div class="card quick" onclick="monthlyReport()"><b>Monthly Coaching Report</b><span class="muted">Sessions, hours, assessments, reflections and match actions.</span></div>
<div class="card quick" onclick="playerReport()"><b>Player Development Report</b><span class="muted">Player profile, latest assessment, development priorities and history.</span></div>
<div class="card quick" onclick="seasonReport()"><b>Season / Full Report</b><span class="muted">Complete overview of your documented coaching work.</span></div>
<div class="card quick" onclick="sessionReport()"><b>Session Report</b><span class="muted">Professional chronological summary of coaching sessions.</span></div>
<div class="card quick" onclick="matchReport()"><b>Match & Fielding Report</b><span class="muted">Chances, run-outs, misfields, observations and training actions.</span></div>
<div class="card quick" onclick="coachReport()"><b>Coach Development Report</b><span class="muted">Reflection history, learning and future coaching priorities.</span></div></div>
<div class="sectionTitle"><h2>Backup & Data</h2></div><div class="card"><div class="toolbar"><button class="btn primary" onclick="backup()">Export Backup</button><label class="btn secondary" style="display:inline-block;cursor:pointer">Import Backup<input type="file" accept=".json" onchange="restore(event)" style="display:none"></label><button class="btn danger" onclick="resetAll()">Reset App</button></div><p class="muted">Your existing records remain compatible with this upgrade.</p></div>`;
}
function rs(t,c){return `<div class="sectionTitle"><h2>${t}</h2></div><div class="card">${c||"—"}</div>`}
function showReport(title,sub,body){modal(`<div class="sheetHead"><div><h2>${title}</h2><div class="muted">${sub}</div></div><button class="x" onclick="closeM()">×</button></div><div id="generatedReport">${body}</div><div class="toolbar" style="margin-top:20px"><button class="btn primary" onclick="printGenerated('${title}')">Print / Save PDF</button><button class="btn secondary" onclick="closeM()">Close</button></div>`)}
function monthlyReport(){
let m=prompt("Month (YYYY-MM)",today().slice(0,7));if(!m)return;
let f=a=>a.filter(x=>(x.date||"").startsWith(m)), ss=f(db.sessions), rr=f(db.reflections), aa=f(db.assessments), mm=f(db.matches);
let mins=ss.reduce((a,s)=>a+(Number(s.duration)||0),0);
showReport("Monthly Coaching Report",m,`<div class="grid g3"><div class="card stat"><span>Sessions</span><b>${ss.length}</b></div><div class="card stat"><span>Hours</span><b>${(mins/60).toFixed(1)}</b></div><div class="card stat"><span>Assessments</span><b>${aa.length}</b></div></div>${rs("Sessions",ss.map(s=>`<b>${esc(s.date)} — ${esc(s.title)}</b><br>${esc(s.squad||"")} · ${esc(s.focus||"")} · ${esc(s.duration||"")} min<br>${esc(s.objectives||"")}<br><br>`).join("")||"No sessions recorded.")}${rs("Coach Reflection & Learning",rr.map(r=>`<b>${esc(r.date)}</b><br>What worked: ${esc(r.well||"—")}<br>Change next time: ${esc(r.change||"—")}<br>Next focus: ${esc(r.next||"—")}<br><br>`).join("")||"No reflections recorded.")}${rs("Match Action Points",mm.map(x=>`<b>${esc(x.team)} vs ${esc(x.opp)}</b><br>${esc(x.actions||x.notes||"—")}<br><br>`).join("")||"No match notes recorded.")}`)}
function playerReport(){
if(!db.players.length){alert("Add a player first.");return}
let name=prompt("Player name:\n"+db.players.map(p=>p.name).join("\n"),db.players[0].name);if(!name)return;
let p=db.players.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!p){alert("Player not found.");return}
let aa=db.assessments.filter(a=>a.player===p.name), a=aa[aa.length-1];
let ratings=a?skills.map((s,i)=>`<div style="margin:9px 0"><b>${s}</b> — ${esc(a["s"+i])}/10</div>`).join(""):"No assessment recorded.";
showReport("Player Development Report",p.name,`<div class="grid g3"><div class="card"><b>Role</b><br>${esc(p.role||"—")}</div><div class="card"><b>Squad</b><br>${esc(p.group||"—")}</div><div class="card"><b>Assessments</b><br>${aa.length}</div></div>${rs("Strengths",esc(p.strengths||"—"))}${rs("Development Areas",esc(p.areas||"—"))}${rs("Current Goal",esc(p.focus||"—"))}${rs("Latest Skill Assessment",ratings)}${rs("Development Priority",a?esc(a.priority||"—"):"—")}${rs("Coach Comments",a?esc(a.comments||p.notes||"—"):esc(p.notes||"—"))}${rs("Assessment History",aa.map(x=>`<b>${esc(x.date)}</b> — Overall ${assessmentAvg(x)}/10<br>${esc(x.priority||"")}<br><br>`).join("")||"No assessment history.")}`)}
function seasonReport(){
let mins=db.sessions.reduce((a,s)=>a+(Number(s.duration)||0),0);
showReport("Season / Full Coaching Report","Complete coaching documentation overview",`<div class="grid g4"><div class="card stat"><span>Sessions</span><b>${db.sessions.length}</b></div><div class="card stat"><span>Hours</span><b>${(mins/60).toFixed(1)}</b></div><div class="card stat"><span>Players</span><b>${db.players.length}</b></div><div class="card stat"><span>Matches</span><b>${db.matches.length}</b></div></div>${rs("Player Development",db.players.map(p=>`<b>${esc(p.name)}</b> — ${esc(p.focus||"No current focus")}<br>`).join("")||"No players recorded.")}${rs("Session Overview",db.sessions.map(s=>`<b>${esc(s.date)} — ${esc(s.title)}</b><br>${esc(s.objectives||"")}<br><br>`).join("")||"No sessions recorded.")}${rs("Assessment Overview",db.assessments.map(a=>`<b>${esc(a.player)}</b> — ${assessmentAvg(a)}/10 · ${esc(a.date)}<br>${esc(a.priority||"")}<br><br>`).join("")||"No assessments recorded.")}${rs("Coach Development",db.reflections.map(r=>`<b>${esc(r.date)}</b><br>${esc(r.change||r.next||r.well||"—")}<br><br>`).join("")||"No reflections recorded.")}${rs("Match Actions",db.matches.map(m=>`<b>${esc(m.date)} — ${esc(m.team)} vs ${esc(m.opp)}</b><br>${esc(m.actions||m.notes||"—")}<br><br>`).join("")||"No match notes recorded.")}`)}
function sessionReport(){showReport("Session Summary Report","All documented coaching sessions",db.sessions.length?db.sessions.slice().reverse().map(s=>rs(`${esc(s.date)} — ${esc(s.title)}`,`<b>Squad:</b> ${esc(s.squad||"—")} · <b>Focus:</b> ${esc(s.focus||"—")} · <b>Duration:</b> ${esc(s.duration||"—")} min<br><br><b>Objectives</b><br>${esc(s.objectives||"—")}<br><br><b>Coaching Cues</b><br>${esc(s.cues||"—")}<br><br><b>Success Criteria</b><br>${esc(s.success||"—")}`)).join(""):empty("No sessions recorded."))}
function matchReport(){showReport("Match & Fielding Report","Match observations and training actions",db.matches.length?db.matches.slice().reverse().map(m=>rs(`${esc(m.date)} — ${esc(m.team)} vs ${esc(m.opp)}`,`<b>Fielding:</b> ${esc(m.rating)}/10 · <b>Taken:</b> ${esc(m.taken||0)} · <b>Missed:</b> ${esc(m.missed||0)} · <b>Run outs:</b> ${esc(m.runouts||0)} · <b>Misfields:</b> ${esc(m.misfields||0)}<br><br><b>Observations</b><br>${esc(m.notes||"—")}<br><br><b>Training Actions</b><br>${esc(m.actions||"—")}`)).join(""):empty("No match notes recorded."))}
function coachReport(){let av=db.reflections.length?(db.reflections.reduce((s,r)=>s+Number(r.rating||0),0)/db.reflections.length).toFixed(1):"—";showReport("Coach Development Report","Professional reflection and learning record",`<div class="grid g3"><div class="card stat"><span>Reflections</span><b>${db.reflections.length}</b></div><div class="card stat"><span>Avg Rating</span><b>${av}</b></div><div class="card stat"><span>Sessions</span><b>${db.sessions.length}</b></div></div>${rs("Reflection History",db.reflections.slice().reverse().map(r=>`<b>${esc(r.date)} — ${esc(r.session||"Coaching")}</b><br><b>Worked:</b> ${esc(r.well||"—")}<br><b>Improve:</b> ${esc(r.better||"—")}<br><b>Change:</b> ${esc(r.change||"—")}<br><b>Next focus:</b> ${esc(r.next||"—")}<br><br>`).join("")||"No reflections recorded.")}`)}
function printGenerated(title){let c=document.getElementById("generatedReport").innerHTML,w=window.open("","_blank");w.document.write(`<!doctype html><html><head><title>${title}</title><style>body{font-family:Arial,sans-serif;color:#18211e;max-width:850px;margin:30px auto;padding:20px}h1{color:#174c3c}h2{font-size:18px;margin-top:25px}.card{border:1px solid #ddd;border-radius:10px;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat b{font-size:24px;color:#174c3c}.stat span{font-size:11px;text-transform:uppercase}</style></head><body><h1>${title}</h1><p>CoachBook Pro · Generated ${new Date().toLocaleDateString()}</p>${c}</body></html>`);w.document.close();setTimeout(()=>w.print(),400)}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="CoachBook-Pro-Backup-"+today()+".json";a.click()}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();alert("Backup restored.")}catch{alert("Invalid backup file.")}};r.readAsText(f)}
function resetAll(){if(confirm("This will erase all CoachBook data on this device. Continue?")){localStorage.removeItem("coachbook");location.reload()}}
function openQuick(){modal(`<div class="sheetHead"><h2>Create</h2><button class="x" onclick="closeM()">×</button></div><div class="grid g2"><button class="btn secondary" onclick="closeM();newSession()">Session Plan</button><button class="btn secondary" onclick="closeM();newReflection()">Self Reflection</button><button class="btn secondary" onclick="closeM();newPlayer()">Player</button><button class="btn secondary" onclick="closeM();newAssessment()">Assessment</button><button class="btn secondary" onclick="closeM();newDrill()">Drill</button><button class="btn secondary" onclick="closeM();newMatch()">Match Note</button></div>`)}
function renderAll(){dashboard();sessions();reflections();players();assessments();drills();matches();reports()}
nav();renderAll();
</script>
</body></html>
