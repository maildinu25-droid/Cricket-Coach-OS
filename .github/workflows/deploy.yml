name: Minify and deploy to GitHub Pages

# Runs automatically on every push to main. Your actual source files stay
# exactly as you write them in the repo — nothing here rewrites your
# source. This only builds a minified COPY into a separate folder and
# publishes that copy as the live site.
on:
  workflow_dispatch: {}
  # Once you've run this manually from the Actions tab and confirmed the
  # deployed site looks and works correctly, uncomment the block below so
  # it runs automatically on every future push instead of needing a manual click.
  # push:
  #   branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install minifier
        run: npm install --no-save html-minifier-terser@7

      - name: Build minified site into _site/
        run: |
          mkdir -p _site
          # Copy everything first (so images, CNAME, non-HTML files still deploy normally)
          rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='_site' ./ _site/

          # Then minify every .html file in place inside _site/, preserving folder structure
          find _site -name "*.html" | while read -r file; do
            npx html-minifier-terser \
              --collapse-whitespace \
              --remove-comments \
              --minify-js true \
              --minify-css true \
              --remove-redundant-attributes \
              --output "$file" \
              "$file"
            echo "Minified: $file"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
