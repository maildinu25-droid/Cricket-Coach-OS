<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#132d46"><link rel="manifest" href="/manifest.json"><title>Cricket Coach OS</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fa;color:#18232e}header{background:#132d46;color:#fff;padding:20px 16px 15px;position:sticky;top:0}h1{font-size:21px;margin:0}main{padding:13px 13px 95px;max-width:800px;margin:auto}.card{background:#fff;border-radius:16px;padding:15px;margin-bottom:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.kpi{font-size:28px;font-weight:800}.muted{font-size:13px;color:#687784}button{border:0;border-radius:11px;background:#2d6fa8;color:#fff;padding:12px;font-size:15px;font-weight:650}button.alt{background:#e7eef4;color:#132d46}input,select,textarea{width:100%;padding:11px;border:1px solid #dbe2e8;border-radius:10px;font-size:16px;margin:5px 0 10px}textarea{min-height:82px}.row{display:flex;gap:8px}.row>*{flex:1}.hidden{display:none}.event{border-left:4px solid #2d6fa8;padding:9px;background:#f7fafc;border-radius:8px;margin:7px 0}h2{font-size:19px;margin:1px 0 11px}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dde3e8;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 3px calc(6px + env(safe-area-inset-bottom))}nav button{background:#fff;color:#596875;font-size:10px;padding:7px 1px}nav b{display:block;font-size:19px}
</style></head><body><header><h1>Cricket Coach OS</h1><div id="dateLine"></div></header><main>
<section id="home"><div class="grid"><div class="card"><div class="kpi" id="ks">0</div><div class="muted">Sessions · 7 days</div></div><div class="card"><div class="kpi" id="ko">0</div><div class="muted">Observations</div></div><div class="card"><div class="kpi" id="kf">0</div><div class="muted">Feedback</div></div><div class="card"><div class="kpi" id="kr">0</div><div class="muted">Reflections</div></div></div><div class="card"><h2>Today</h2><div id="today"></div></div><div class="card"><h2>Quick capture</h2><div class="row"><button onclick="show('session')">Document session</button><button onclick="show('observation')">Observation</button></div><div class="row" style="margin-top:8px"><button class="alt" onclick="show('feedback')">Feedback</button><button class="alt" onclick="show('reflection')">Reflect</button></div></div><div class="card"><h2>Follow-ups</h2><div id="follow"></div></div></section>
<section id="schedule" class="hidden"><div class="card"><h2>Next 7 days</h2><div id="week"></div></div><div class="card"><h2>Add event</h2><form onsubmit="save(event,'schedule')"><input name="date" type="date" required><div class="row"><input name="start" type="time" required><input name="end" type="time"></div><select name="type"><option>Team Training</option><option>1-to-1</option><option>Small Group</option><option>Match</option></select><input name="teamPlayer" placeholder="Team / player"><input name="focus" placeholder="Focus"><button>Save</button></form></div></section>
<section id="session" class="hidden card"><h2>Session record</h2><form onsubmit="save(event,'sessions')"><input name="date" type="date" required><select name="type"><option>Team</option><option>1-to-1</option><option>Small Group</option><option>Match</option></select><input name="teamPlayer" placeholder="Team / player" required><input name="theme" placeholder="Main theme" required><textarea name="outcomes" placeholder="Outcomes"></textarea><textarea name="worked" placeholder="What worked?"></textarea><textarea name="change" placeholder="What needs changing?"></textarea><textarea name="followUp" placeholder="Follow-up"></textarea><button>Save session</button></form></section>
<section id="observation" class="hidden card"><h2>Player observation</h2><form onsubmit="save(event,'observations')"><input name="date" type="date" required><input name="player" placeholder="Player" required><select name="category"><option>Batting</option><option>Bowling</option><option>Fielding</option><option>Wicketkeeping</option><option>Tactical</option><option>Decision-making</option><option>Mental</option><option>Physical</option></select><textarea name="observation" placeholder="What did you notice?" required></textarea><textarea name="followUp" placeholder="Next action"></textarea><button>Save observation</button></form></section>
<section id="feedback" class="hidden card"><h2>Feedback</h2><form onsubmit="save(event,'feedback')"><input name="date" type="date" required><input name="player" placeholder="Player" required><textarea name="coachObservation" placeholder="Coach observation"></textarea><textarea name="playerPerception" placeholder="Player perception"></textarea><textarea name="agreedAction" placeholder="Agreed action"></textarea><button>Save feedback</button></form></section>
<section id="reflection" class="hidden card"><h2>Coach reflection</h2><form onsubmit="save(event,'reflections')"><input name="date" type="date" required><textarea name="noticed" placeholder="What did I notice?"></textarea><textarea name="worked" placeholder="What worked?"></textarea><textarea name="didnt" placeholder="What didn't?"></textarea><textarea name="change" placeholder="One change next time"></textarea><button>Save reflection</button></form></section>
<section id="players" class="hidden"><div class="card"><h2>Players</h2><div id="playerList"></div></div><div class="card"><h2>Add player</h2><form onsubmit="save(event,'players')"><input name="name" placeholder="Player name" required><input name="team" placeholder="Team / group"><input name="role" placeholder="Role"><input name="aspiration" placeholder="Long-term aspiration"><button>Add player</button></form></div><div class="card"><h2>IDP goal</h2><form onsubmit="save(event,'idp')"><input name="date" type="date" required><input name="player" placeholder="Player" required><input name="area" placeholder="Development area"><textarea name="desired" placeholder="Desired behaviour"></textarea><textarea name="strategy" placeholder="Training strategy"></textarea><input name="reviewDate" type="date"><button>Save goal</button></form></div></section>
<section id="reports" class="hidden"><div class="card"><h2>Weekly report</h2><div id="report"></div><div class="row"><button onclick="copyReport()">Copy report</button><button class="alt" onclick="location.href='/api/export'">Backup</button></div></div><div class="card"><h2>Match review</h2><form onsubmit="save(event,'matchreviews')"><input name="date" type="date" required><input name="opponent" placeholder="Opponent"><input name="result" placeholder="Result"><textarea name="well" placeholder="What did we do well?"></textarea><textarea name="hurt" placeholder="What hurt us?"></textarea><input name="priority1" placeholder="Training priority 1"><input name="priority2" placeholder="Training priority 2"><button>Save review</button></form></div></section>
</main><nav><button onclick="show('home')"><b>⌂</b>Today</button><button onclick="show('schedule')"><b>▣</b>Schedule</button><button onclick="show('session')"><b>＋</b>Session</button><button onclick="show('players')"><b>♙</b>Players</button><button onclick="show('reports')"><b>≡</b>Reports</button></nav><script src="/app.js"></script></body></html>
