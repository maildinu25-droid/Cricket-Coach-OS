<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#174c3c">
<title>CoachBook Pro</title>
<style>
:root{--g:#174c3c;--g2:#246b55;--mint:#edf6f2;--ink:#18211e;--muted:#707a76;--line:#dce6e1;--bg:#f5f7f6;--red:#a23b3b;--shadow:0 8px 28px rgba(20,55,44,.08)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit}.top{position:sticky;top:0;z-index:20;height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px}.brand{font-size:21px;font-weight:800;color:var(--g)}.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:1px;font-weight:600}.menu{border:0;background:var(--mint);border-radius:12px;padding:10px 12px;color:#1680ff}
.layout{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 68px)}aside{background:#fff;border-right:1px solid var(--line);padding:16px 12px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;padding:12px;border-radius:10px;color:#46504c}.nav button.active{background:var(--mint);color:var(--g);font-weight:800}
main{padding:25px;max-width:1200px;width:100%;margin:auto}.page{display:none}.page.active{display:block}.hero{margin-bottom:20px}.hero h1{margin:0 0 6px;font-size:29px}.muted{color:var(--muted)}.grid{display:grid;gap:15px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:var(--shadow)}.stat span{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.6px}.stat b{display:block;font-size:29px;color:var(--g);margin-top:8px}.section{margin:25px 0 12px;font-size:19px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:750;cursor:pointer}.primary{background:var(--g);color:#fff}.secondary{background:var(--mint);color:var(--g)}.danger{background:#f9eaea;color:var(--red)}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.list{display:grid;gap:9px}.item{border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;justify-content:space-between;gap:10px;align-items:center}.tag{display:inline-block;background:var(--mint);color:var(--g);padding:5px 8px;border-radius:999px;font-size:11px;margin:2px}.quick{cursor:pointer}.quick b,.reportCard b{color:var(--g);font-size:18px}.reportCard{cursor:pointer}.reportCard p{color:var(--muted);margin-bottom:0}.empty{text-align:center;padding:28px;color:var(--muted);border:1px dashed #cbd8d2;border-radius:12px}
input,textarea,select{width:100%;padding:11px 12px;border:1px solid #ccd7d2;border-radius:10px;background:#fff}textarea{min-height:95px;resize:vertical}label{display:grid;gap:6px;font-size:13px;font-weight:650;color:#46504c}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.full{grid-column:1/-1}
.modal{display:none;position:fixed;inset:0;background:rgba(10,25,20,.5);z-index:50;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{background:#fff;width:min(780px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px}.sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.sheetHead h2{margin:0}.x{border:0;border-radius:50%;width:38px;height:38px;background:#eef2f0}.rating{display:grid;grid-template-columns:1fr 80px;gap:10px;align-items:center;margin:8px 0}.skillPick{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.skillPick label{display:flex;flex-direction:row;align-items:center;border:1px solid var(--line);padding:10px;border-radius:10px}.skillPick input{width:auto}.fab{position:fixed;right:22px;bottom:22px;width:58px;height:58px;border:0;border-radius:50%;background:var(--g);color:#fff;font-size:30px;z-index:30}
.report{background:#fff}.report h1{color:var(--g)}.report h2{margin-top:24px}.reportTable{width:100%;border-collapse:collapse}.reportTable th,.reportTable td{border-bottom:1px solid var(--line);padding:9px;text-align:left;vertical-align:top}.reportActions{position:sticky;bottom:0;background:#fff;padding:12px 0}
@media(max-width:850px){.layout{grid-template-columns:1fr}aside{position:fixed;z-index:40;left:-260px;top:68px;bottom:0;width:250px;transition:.2s;box-shadow:var(--shadow)}aside.open{left:0}.g4,.g3{grid-template-columns:repeat(2,1fr)}main{padding:17px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
@media(max-width:520px){.g4,.g3,.g2{grid-template-columns:1fr}.hero h1{font-size:26px}.card{padding:16px}}
@page{size:A4;margin:12mm}
@media print{
  html,body{background:#fff!important;width:auto!important;height:auto!important;overflow:visible!important}
  body *{visibility:hidden!important}
  #modal,#modal *{visibility:visible!important}
  #modal{
    display:block!important;position:static!important;inset:auto!important;
    background:#fff!important;width:100%!important;height:auto!important;
    overflow:visible!important
  }
  #sheet{
    display:block!important;position:static!important;width:100%!important;
    max-width:none!important;max-height:none!important;overflow:visible!important;
    border-radius:0!important;padding:0!important;background:#fff!important
  }
  .top,aside,.fab,.reportActions,.noPrint,.sheetHead{display:none!important}
  .report{display:block!important;width:100%!important;max-width:none!important;background:#fff!important}
  .report h1{font-size:24pt!important;margin:0 0 4mm!important}
  .report h2{font-size:15pt!important;margin:7mm 0 3mm!important;break-after:avoid-page;page-break-after:avoid}
  .report .muted{margin-bottom:5mm!important}
  .report .grid{display:grid!important;gap:4mm!important}
  .report .g4{grid-template-columns:repeat(4,1fr)!important}
  .report .g3{grid-template-columns:repeat(3,1fr)!important}
  .report .g2{grid-template-columns:repeat(2,1fr)!important}
  .report .card{
    box-shadow:none!important;border:1px solid #dce6e1!important;
    border-radius:10px!important;padding:4mm!important;margin:0 0 4mm!important;
    break-inside:avoid-page!important;page-break-inside:avoid!important
  }
  .report .stat b{font-size:22pt!important}
  .reportTable{font-size:9.5pt!important}
  .reportTable tr{break-inside:avoid-page!important;page-break-inside:avoid!important}
  .reportTable th,.reportTable td{padding:2.5mm!important}
  .tag{border:1px solid #dce6e1!important}
  p{orphans:3;widows:3}
}
</style>
</head>
<body>
<header class="top"><button class="menu" onclick="toggleMenu()">☰</button><div class="brand">CoachBook Pro<small>PROFESSIONAL CRICKET COACHING</small></div></header>
<div class="layout"><aside id="side"><div class="nav" id="nav"></div></aside><main>
<section id="dashboard" class="page active"></section><section id="sessions" class="page"></section><section id="reflections" class="page"></section><section id="players" class="page"></section><section id="assessments" class="page"></section><section id="drills" class="page"></section><section id="matches" class="page"></section><section id="reports" class="page"></section>
</main></div>
<button class="fab" onclick="quick()">+</button><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const pages=[["dashboard","Dashboard"],["sessions","Session Plans"],["reflections","Self Reflections"],["players","Players"],["assessments","Assessments"],["drills","Drill Library"],["matches","Match Notes"],["reports","Professional Reports"]];
const seed=[{name:"High Catch Pressure Circle",cat:"Fielding",players:"6–12",duration:"15 min",points:"Early call, balanced base, attack the ball, secure finish."},{name:"Direct Hit Competition",cat:"Fielding",players:"6–14",duration:"12 min",points:"Gather under control, align feet, quick release."}];
let db;try{db=JSON.parse(localStorage.getItem("coachbook"))}catch(e){};db=db||{sessions:[],reflections:[],players:[],assessments:[],matches:[],drills:seed};
["sessions","reflections","players","assessments","matches","drills"].forEach(k=>db[k]=Array.isArray(db[k])?db[k]:[]);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));const today=()=>new Date().toISOString().slice(0,10);
function save(){localStorage.setItem("coachbook",JSON.stringify(db));renderAll()}function head(t,s){return `<div class="hero"><h1>${t}</h1><div class="muted">${s}</div></div>`}function empty(t){return `<div class="empty">${t}</div>`}
function nav(){navEl=document.getElementById("nav");navEl.innerHTML=pages.map(([id,n],i)=>`<button class="${i?"":"active"}" onclick="go('${id}',this)">${n}</button>`).join("")}
function go(id,b){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));if(b)b.classList.add("active");side.classList.remove("open")}function toggleMenu(){side.classList.toggle("open")}
function modal(h){sheet.innerHTML=h;modalEl.classList.add("open")}function closeM(){modalEl.classList.remove("open")}const modalEl=document.getElementById("modal"),sheet=document.getElementById("sheet"),side=document.getElementById("side");modalEl.onclick=e=>{if(e.target===modalEl)closeM()}
function del(k,i){if(confirm("Delete this entry?")){db[k].splice(i,1);save()}}
function dashboard(){let hrs=db.sessions.reduce((a,s)=>a+(+s.duration||0),0)/60;dashboardEl.innerHTML=head("Coaching Dashboard","Your professional coaching workspace.")+`<div class="grid g4"><div class="card stat"><span>Sessions</span><b>${db.sessions.length}</b></div><div class="card stat"><span>Coaching Hours</span><b>${hrs.toFixed(1)}</b></div><div class="card stat"><span>Players</span><b>${db.players.length}</b></div><div class="card stat"><span>Assessments</span><b>${db.assessments.length}</b></div></div><h2 class="section">Quick actions</h2><div class="grid g4"><div class="card quick" onclick="newSession()"><b>Session Plan</b><p>Plan objectives, blocks and coaching cues.</p></div><div class="card quick" onclick="newReflection()"><b>Reflection</b><p>Capture coaching learning.</p></div><div class="card quick" onclick="newPlayer()"><b>Add Player</b><p>Build player development records.</p></div><div class="card quick" onclick="newAssessment()"><b>Assessment</b><p>Assess batting, bowling, fielding or keeping.</p></div></div>`}
const dashboardEl=document.getElementById("dashboard");
function sessions(){document.getElementById("sessions").innerHTML=head("Session Plans","Plan, document and review every coaching session.")+`<button class="btn primary noPrint" onclick="newSession()">+ New Session</button><h2 class="section">Sessions</h2><div class="card">${db.sessions.length?`<div class="list">${db.sessions.slice().reverse().map((s,r)=>{let i=db.sessions.length-1-r;return `<div class="item"><div><b>${esc(s.title)}</b><div class="muted">${esc(s.date)} · ${esc(s.squad)} · ${esc(s.duration)} min</div><small>${esc(s.objectives)}</small></div><button class="btn danger" onclick="del('sessions',${i})">×</button></div>`}).join("")}</div>`:empty("No sessions yet.")}</div>`}
function newSession(){modal(`<div class="sheetHead"><h2>New Session Plan</h2><button class="x" onclick="closeM()">×</button></div><form class="formgrid" onsubmit="addSession(event)"><label>Date<input type="date" name="date" value="${today()}" required></label><label>Session title<input name="title" required></label><label>Squad / Group<input name="squad"></label><label>Duration (minutes)<input type="number" name="duration" value="90"></label><label>Primary focus<select name="focus"><option>Batting</option><option>Bowling</option><option>Fielding</option><option>Wicketkeeping</option><option>Team</option><option>Fitness</option></select></label><label>Venue<input name="venue"></label><label class="full">Objectives<textarea name="objectives"></textarea></label><label class="full">Warm-up / Preparation<textarea name="warmup"></textarea></label><label class="full">Main Skill Block<textarea name="main"></textarea></label><label class="full">Competitive / Game Block<textarea name="game"></textarea></label><label class="full">Coaching Cues<textarea name="cues"></textarea></label><label class="full">Success Criteria<textarea name="success"></textarea></label><button class="btn primary">Save Session</button></form>`)}function addSession(e){e.preventDefault();db.sessions.push(Object.fromEntries(new FormData(e.target)));closeM();save()}
function reflections(){document.getElementById("reflections").innerHTML=head("Self Reflections","Turn experience into deliberate coaching improvement.")+`<button class="btn primary" onclick="newReflection()">+ New Reflection</button><h2 class="section">Reflection history</h2><div class="card">${db.reflections.length?db.reflections.slice().reverse().map((x,r)=>`<div class="item"><div><b>${esc(x.date)} · ${esc(x.session||"Reflection")}</b><div class="muted">Rating ${esc(x.rating)}/5</div><small>${esc(x.well)}</small></div><button class="btn danger" onclick="del('reflections',${db.reflections.length-1-r})">×</button></div>`).join(""):empty("No reflections yet.")}</div>`}
function newReflection(){modal(`<div class="sheetHead"><h2>Coach Self Reflection</h2><button class="x" onclick="closeM()">×</button></div><form class="formgrid" onsubmit="addReflection(event)"><label>Date<input type="date" name="date" value="${today()}"></label><label>Session / Group<input name="session"></label><label>Overall rating<select name="rating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label>Communication<select name="communication"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label class="full">What went well?<textarea name="well"></textarea></label><label class="full">What could be better?<textarea name="better"></textarea></label><label class="full">What did I learn?<textarea name="players"></textarea></label><label class="full">What will I change next time?<textarea name="change"></textarea></label><label class="full">Next focus<textarea name="next"></textarea></label><button class="btn primary">Save Reflection</button></form>`)}function addReflection(e){e.preventDefault();db.reflections.push(Object.fromEntries(new FormData(e.target)));closeM();save()}
function players(){document.getElementById("players").innerHTML=head("Players","Development record for every player.")+`<button class="btn primary" onclick="newPlayer()">+ Add Player</button><h2 class="section">Player database</h2><div class="grid g3">${db.players.length?db.players.map((p,i)=>`<div class="card"><b>${esc(p.name)}</b><div class="muted">${esc(p.role||"Player")} · ${esc(p.group||"Squad")}</div><p>${esc(p.focus||"")}</p><div class="toolbar"><button class="btn secondary" onclick="playerView(${i})">Profile</button><button class="btn danger" onclick="del('players',${i})">×</button></div></div>`).join(""):empty("Add players to begin.")}</div>`}
function newPlayer(){modal(`<div class="sheetHead"><h2>Add Player</h2><button class="x" onclick="closeM()">×</button></div><form class="formgrid" onsubmit="addPlayer(event)"><label>Player name<input name="name" required></label><label>Squad / Group<input name="group"></label><label>Role<select name="role"><option>Batter</option><option>Bowler</option><option>All-rounder</option><option>Wicketkeeper</option><option>Wicketkeeper-Batter</option></select></label><label>Age<input type="number" name="age"></label><label class="full">Strengths<textarea name="strengths"></textarea></label><label class="full">Development areas<textarea name="areas"></textarea></label><label class="full">Current focus / goal<textarea name="focus"></textarea></label><label class="full">Coach notes<textarea name="notes"></textarea></label><button class="btn primary">Save Player</button></form>`)}function addPlayer(e){e.preventDefault();db.players.push(Object.fromEntries(new FormData(e.target)));closeM();save()}
function playerView(i){let p=db.players[i], aa=db.assessments.filter(a=>a.player===p.name).slice(-1)[0];modal(`<div class="sheetHead"><h2>${esc(p.name)}</h2><button class="x" onclick="closeM()">×</button></div><div class="grid g2"><div class="card"><b>Role</b><div>${esc(p.role)}</div></div><div class="card"><b>Squad</b><div>${esc(p.group)}</div></div></div><h2 class="section">Current goal</h2><div class="card">${esc(p.focus||"—")}</div>${aa?`<h2 class="section">Latest assessment</h2><div class="card"><b>Overall ${assessmentAvg(aa)}/10</b><br>${assessmentDisciplines(aa).map(d=>`<span class="tag">${d} ${disciplineAvg(aa,d)}/10</span>`).join("")}</div>${assessmentDetailHTML(aa)}`:""}`)}
const skillSets={Batting:["Setup & Balance","Footwork","Bat Swing / Contact","Shot Selection","Playing Pace","Playing Spin","Strike Rotation","Boundary Options","Game Awareness","Execution Under Pressure"],Bowling:["Run-up / Approach","Action & Alignment","Accuracy","Length Control","Consistency","Pace / Revolutions","Swing / Seam / Spin","Variations","Tactical Awareness","Execution Under Pressure"],Fielding:["Catching","Ground Fielding","Throwing Accuracy","Throwing Power","Movement & Agility","Positioning","Game Awareness","Communication","Decision Making","Execution Under Pressure"],Wicketkeeping:["Set Position","Footwork","Glove Work","Standing Back","Standing Up","Taking Spin","Leg-side Takes","Gather & Release","Communication","Decision Making"]};const legacySkills=["Catching","Ground Fielding","Throwing Accuracy","Movement","Game Awareness","Communication","Decision Making","Work Ethic","Coachability"];
function assessments(){document.getElementById("assessments").innerHTML=head("Player Assessments","Choose one or more disciplines. For an all-rounder select Batting + Bowling; Fielding can also be added.")+`<button class="btn primary" onclick="newAssessment()">+ New Assessment</button><h2 class="section">Assessment history</h2><div class="card">${db.assessments.length?db.assessments.slice().reverse().map((a,r)=>`<div class="item"><div><b>${esc(a.player)}</b><div class="muted">${esc(a.date)} · Overall ${assessmentAvg(a)}/10</div><div>${assessmentDisciplines(a).map(d=>`<span class="tag">${esc(d)}</span>`).join("")}</div><small>${esc(a.priority||"")}</small></div><button class="btn danger" onclick="del('assessments',${db.assessments.length-1-r})">×</button></div>`).join(""):empty("No assessments yet.")}</div>`}
function newAssessment(){if(!db.players.length){alert("Add a player first.");return}modal(`<div class="sheetHead"><h2>Player Assessment</h2><button class="x" onclick="closeM()">×</button></div><form onsubmit="addAssessment(event)"><div class="formgrid"><label>Player<select name="player">${db.players.map(p=>`<option>${esc(p.name)}</option>`).join("")}</select></label><label>Date<input type="date" name="date" value="${today()}"></label></div><h2 class="section">Choose Skill Areas</h2><div class="muted">Select as many as required.</div><div class="skillPick">${Object.keys(skillSets).map(k=>`<label><input type="checkbox" name="disciplines" value="${k}" onchange="renderAssessmentSkills()"> ${k}</label>`).join("")}</div><div id="assessmentSkills">${empty("Select at least one skill area.")}</div><label>Key development priority<textarea name="priority"></textarea></label><label>Coach comments<textarea name="comments"></textarea></label><button class="btn primary">Save Assessment</button></form>`)}
function renderAssessmentSkills(){let box=document.getElementById("assessmentSkills"),sel=[...document.querySelectorAll('input[name="disciplines"]:checked')].map(x=>x.value);box.innerHTML=sel.map(d=>`<h2 class="section">${d} · Rate 1–10</h2><div class="card">${skillSets[d].map((s,i)=>`<div class="rating"><label>${s}</label><input name="${d}_${i}" type="number" min="1" max="10" value="5"></div>`).join("")}<label>${d} development notes<textarea name="${d}_notes"></textarea></label></div>`).join("")||empty("Select at least one skill area.")}
function addAssessment(e){e.preventDefault();let fd=new FormData(e.target),sel=fd.getAll("disciplines");if(!sel.length){alert("Select at least one skill area.");return}let a={player:fd.get("player"),date:fd.get("date"),disciplines:sel,priority:fd.get("priority"),comments:fd.get("comments"),ratings:{},disciplineNotes:{}};sel.forEach(d=>{a.ratings[d]=skillSets[d].map((_,i)=>Number(fd.get(`${d}_${i}`)||0));a.disciplineNotes[d]=fd.get(`${d}_notes`)||""});db.assessments.push(a);closeM();save()}
function assessmentDisciplines(a){return Array.isArray(a.disciplines)&&a.disciplines.length?a.disciplines:["Fielding"]}function disciplineAvg(a,d){let n=[];if(a.ratings&&Array.isArray(a.ratings[d]))n=a.ratings[d].map(Number).filter(x=>x>0);else if(d==="Fielding")n=legacySkills.map((_,i)=>Number(a["s"+i]||0)).filter(x=>x>0);return n.length?(n.reduce((x,y)=>x+y,0)/n.length).toFixed(1):"—"}function assessmentAvg(a){let n=assessmentDisciplines(a).map(d=>Number(disciplineAvg(a,d))).filter(Number.isFinite);return n.length?(n.reduce((x,y)=>x+y,0)/n.length).toFixed(1):"—"}
function assessmentDetailHTML(a){return assessmentDisciplines(a).map(d=>{let vals=a.ratings?.[d]||[],labels=skillSets[d]||legacySkills;if(!vals.length&&d==="Fielding")vals=legacySkills.map((_,i)=>Number(a["s"+i]||0));return `<h2 class="section">${d} · ${disciplineAvg(a,d)}/10</h2><div class="card">${labels.map((s,i)=>vals[i]?`<div><b>${esc(s)}</b> — ${esc(vals[i])}/10</div>`:"").join("")}${a.disciplineNotes?.[d]?`<p><b>Development notes</b><br>${esc(a.disciplineNotes[d])}</p>`:""}</div>`}).join("")}
function drills(){document.getElementById("drills").innerHTML=head("Drill Library","Keep your best coaching practices organised and reusable.")+`<button class="btn primary" onclick="newDrill()">+ Add Drill</button><h2 class="section">Drills</h2><div class="grid g2">${db.drills.map((d,i)=>`<div class="card"><span class="tag">${esc(d.cat)}</span><h3>${esc(d.name)}</h3><div class="muted">${esc(d.players)} · ${esc(d.duration)}</div><p>${esc(d.points)}</p><button class="btn danger" onclick="del('drills',${i})">Delete</button></div>`).join("")}</div>`}function newDrill(){modal(`<div class="sheetHead"><h2>Add Drill</h2><button class="x" onclick="closeM()">×</button></div><form class="formgrid" onsubmit="addDrill(event)"><label>Drill name<input name="name" required></label><label>Category<input name="cat"></label><label>Players<input name="players"></label><label>Duration<input name="duration"></label><label class="full">Organisation & coaching points<textarea name="points"></textarea></label><button class="btn primary">Save Drill</button></form>`)}function addDrill(e){e.preventDefault();db.drills.push(Object.fromEntries(new FormData(e.target)));closeM();save()}
function matches(){document.getElementById("matches").innerHTML=head("Match Notes","Capture fielding events, observations and training actions.")+`<button class="btn primary" onclick="newMatch()">+ Match Note</button><h2 class="section">Match history</h2><div class="card">${db.matches.length?db.matches.slice().reverse().map((m,r)=>`<div class="item"><div><b>${esc(m.team)} vs ${esc(m.opp)}</b><div class="muted">${esc(m.date)} · Fielding ${esc(m.rating)}/10</div><small>${esc(m.actions)}</small></div><button class="btn danger" onclick="del('matches',${db.matches.length-1-r})">×</button></div>`).join(""):empty("No match notes yet.")}</div>`}
function newMatch(){modal(`<div class="sheetHead"><h2>Match Observation</h2><button class="x" onclick="closeM()">×</button></div><form class="formgrid" onsubmit="addMatch(event)"><label>Date<input type="date" name="date" value="${today()}"></label><label>Your team<input name="team"></label><label>Opposition<input name="opp"></label><label>Fielding rating /10<input type="number" name="rating" min="1" max="10" value="7"></label><label>Chances taken<input type="number" name="taken"></label><label>Chances missed<input type="number" name="missed"></label><label>Run outs<input type="number" name="runouts"></label><label>Misfields<input type="number" name="misfields"></label><label class="full">Key observations<textarea name="notes"></textarea></label><label class="full">Action items for training<textarea name="actions"></textarea></label><button class="btn primary">Save Match Note</button></form>`)}function addMatch(e){e.preventDefault();db.matches.push(Object.fromEntries(new FormData(e.target)));closeM();save()}
function reports(){let hrs=db.sessions.reduce((a,s)=>a+(+s.duration||0),0)/60,nums=db.assessments.map(a=>Number(assessmentAvg(a))).filter(Number.isFinite),avg=nums.length?(nums.reduce((a,b)=>a+b,0)/nums.length).toFixed(1):"—";document.getElementById("reports").innerHTML=head("Professional Reports","Generate polished reports from the information you already enter in CoachBook Pro.")+`<div class="grid g4"><div class="card stat"><span>Sessions</span><b>${db.sessions.length}</b></div><div class="card stat"><span>Coaching Hours</span><b>${hrs.toFixed(1)}</b></div><div class="card stat"><span>Assessments</span><b>${db.assessments.length}</b></div><div class="card stat"><span>Avg Assessment</span><b>${avg}</b></div></div><h2 class="section">Generate Report</h2><div class="grid g2"><div class="card reportCard" onclick="monthlyReport()"><b>Monthly Coaching Report</b><p>Sessions, hours, assessments, reflections and match actions.</p></div><div class="card reportCard" onclick="playerReport()"><b>Player Development Report</b><p>Player profile, latest assessment, development priorities and history.</p></div><div class="card reportCard" onclick="seasonReport()"><b>Season / Full Report</b><p>Complete overview of your documented coaching work.</p></div><div class="card reportCard" onclick="sessionReport()"><b>Session Report</b><p>Professional chronological summary of coaching sessions.</p></div><div class="card reportCard" onclick="matchReport()"><b>Match & Fielding Report</b><p>Chances, run-outs, misfields, observations and training actions.</p></div><div class="card reportCard" onclick="coachReport()"><b>Coach Development Report</b><p>Reflection history, learning and future coaching actions.</p></div></div><h2 class="section">Data tools</h2><div class="card toolbar"><button class="btn secondary" onclick="backup()">Export Backup</button><label class="btn secondary" style="display:inline-block">Import Backup<input type="file" accept=".json" onchange="restore(event)" style="display:none"></label></div>`}
function printReport(){
  document.body.classList.add("printingReport");
  setTimeout(()=>window.print(),100);
}
window.addEventListener("afterprint",()=>document.body.classList.remove("printingReport"));
function reportShell(title,sub,body){modal(`<div class="sheetHead noPrint"><h2>${title}</h2><button class="x" onclick="closeM()">×</button></div><div class="report"><h1>${title}</h1><div class="muted">${sub}</div>${body}<div class="reportActions noPrint"><button class="btn primary" onclick="printReport()">Print / Save PDF</button></div></div>`)}
function monthKey(d){return String(d||"").slice(0,7)}function monthlyReport(){let mk=today().slice(0,7),ss=db.sessions.filter(x=>monthKey(x.date)===mk),aa=db.assessments.filter(x=>monthKey(x.date)===mk),rr=db.reflections.filter(x=>monthKey(x.date)===mk),mm=db.matches.filter(x=>monthKey(x.date)===mk),hrs=ss.reduce((a,s)=>a+(+s.duration||0),0)/60;reportShell("Monthly Coaching Report",mk,`<div class="grid g4"><div class="card stat"><span>Sessions</span><b>${ss.length}</b></div><div class="card stat"><span>Hours</span><b>${hrs.toFixed(1)}</b></div><div class="card stat"><span>Assessments</span><b>${aa.length}</b></div><div class="card stat"><span>Reflections</span><b>${rr.length}</b></div></div><h2>Sessions</h2>${ss.length?ss.map(s=>`<div class="card"><b>${esc(s.date)} · ${esc(s.title)}</b><p>${esc(s.objectives||"")}</p></div>`).join(""):empty("No sessions in this month.")}<h2>Assessments</h2>${aa.length?aa.map(a=>`<div class="card"><b>${esc(a.player)} · ${assessmentAvg(a)}/10</b><p>${esc(a.priority||"")}</p></div>`).join(""):empty("No assessments in this month.")}<h2>Match actions</h2>${mm.length?mm.map(m=>`<div class="card"><b>${esc(m.team)} vs ${esc(m.opp)}</b><p>${esc(m.actions||m.notes||"")}</p></div>`).join(""):empty("No match notes in this month.")}`)}
function playerReport(){if(!db.players.length){alert("Add a player first.");return}modal(`<div class="sheetHead"><h2>Player Development Report</h2><button class="x" onclick="closeM()">×</button></div><label>Select player<select id="reportPlayer">${db.players.map((p,i)=>`<option value="${i}">${esc(p.name)}</option>`).join("")}</select></label><button class="btn primary" style="margin-top:15px" onclick="buildPlayerReport()">Generate Report</button>`)}function buildPlayerReport(){let p=db.players[+document.getElementById("reportPlayer").value],aa=db.assessments.filter(a=>a.player===p.name);reportShell("Player Development Report",`${p.name} · ${p.role||"Player"}`,`<div class="grid g2"><div class="card"><b>Squad</b><div>${esc(p.group||"—")}</div></div><div class="card"><b>Current goal</b><div>${esc(p.focus||"—")}</div></div></div><h2>Profile</h2><div class="card"><b>Strengths</b><p>${esc(p.strengths||"—")}</p><b>Development areas</b><p>${esc(p.areas||"—")}</p></div><h2>Assessment History</h2>${aa.length?aa.map(a=>`<div class="card"><b>${esc(a.date)} · Overall ${assessmentAvg(a)}/10</b><div>${assessmentDisciplines(a).map(d=>`<span class="tag">${d} ${disciplineAvg(a,d)}/10</span>`).join("")}</div><p><b>Priority:</b> ${esc(a.priority||"—")}</p>${assessmentDetailHTML(a)}</div>`).join(""):empty("No assessments for this player.")}`)}
function seasonReport(){let hrs=db.sessions.reduce((a,s)=>a+(+s.duration||0),0)/60;reportShell("Season / Full Report","Complete CoachBook Pro record",`<div class="grid g4"><div class="card stat"><span>Sessions</span><b>${db.sessions.length}</b></div><div class="card stat"><span>Hours</span><b>${hrs.toFixed(1)}</b></div><div class="card stat"><span>Players</span><b>${db.players.length}</b></div><div class="card stat"><span>Matches</span><b>${db.matches.length}</b></div></div><h2>Players</h2>${db.players.map(p=>`<div class="card"><b>${esc(p.name)} · ${esc(p.role)}</b><p>${esc(p.focus||"")}</p></div>`).join("")||empty("No players.")}<h2>Sessions</h2>${db.sessions.map(s=>`<div class="card"><b>${esc(s.date)} · ${esc(s.title)}</b><p>${esc(s.objectives||"")}</p></div>`).join("")||empty("No sessions.")}<h2>Coach reflections</h2>${db.reflections.map(r=>`<div class="card"><b>${esc(r.date)}</b><p>${esc(r.well||"")}</p><p><b>Next:</b> ${esc(r.change||r.next||"")}</p></div>`).join("")||empty("No reflections.")}`)}
function sessionReport(){reportShell("Session Report","Chronological coaching-session record",db.sessions.length?`<table class="reportTable"><tr><th>Date</th><th>Session</th><th>Focus</th><th>Objectives</th></tr>${db.sessions.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(s=>`<tr><td>${esc(s.date)}</td><td>${esc(s.title)}</td><td>${esc(s.focus)}</td><td>${esc(s.objectives)}</td></tr>`).join("")}</table>`:empty("No sessions documented."))}
function matchReport(){let taken=db.matches.reduce((a,m)=>a+(+m.taken||0),0),missed=db.matches.reduce((a,m)=>a+(+m.missed||0),0),ro=db.matches.reduce((a,m)=>a+(+m.runouts||0),0),mf=db.matches.reduce((a,m)=>a+(+m.misfields||0),0);reportShell("Match & Fielding Report","Match observations and fielding actions",`<div class="grid g4"><div class="card stat"><span>Chances Taken</span><b>${taken}</b></div><div class="card stat"><span>Missed</span><b>${missed}</b></div><div class="card stat"><span>Run Outs</span><b>${ro}</b></div><div class="card stat"><span>Misfields</span><b>${mf}</b></div></div><h2>Match History</h2>${db.matches.map(m=>`<div class="card"><b>${esc(m.date)} · ${esc(m.team)} vs ${esc(m.opp)}</b><p>Fielding rating: ${esc(m.rating)}/10 · Taken ${esc(m.taken||0)} · Missed ${esc(m.missed||0)} · Run outs ${esc(m.runouts||0)} · Misfields ${esc(m.misfields||0)}</p><p><b>Observations:</b> ${esc(m.notes||"—")}</p><p><b>Training actions:</b> ${esc(m.actions||"—")}</p></div>`).join("")||empty("No match notes.")}`)}
function coachReport(){reportShell("Coach Development Report","Reflection history, learning and future actions",db.reflections.length?db.reflections.map(r=>`<div class="card"><b>${esc(r.date)} · ${esc(r.session||"Coaching Reflection")}</b><p><b>Rating:</b> ${esc(r.rating)}/5 · Communication ${esc(r.communication||"—")}/5</p><p><b>What went well:</b> ${esc(r.well||"—")}</p><p><b>What could improve:</b> ${esc(r.better||"—")}</p><p><b>Learning:</b> ${esc(r.players||"—")}</p><p><b>Change next time:</b> ${esc(r.change||"—")}</p><p><b>Next focus:</b> ${esc(r.next||"—")}</p></div>`).join(""):empty("No reflections documented."))}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="CoachBook-Pro-Backup-"+today()+".json";a.click()}function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();alert("Backup restored.")}catch(e){alert("Invalid backup file.")}};r.readAsText(f)}
function quick(){modal(`<div class="sheetHead"><h2>Create</h2><button class="x" onclick="closeM()">×</button></div><div class="grid g2"><button class="btn secondary" onclick="closeM();newSession()">Session Plan</button><button class="btn secondary" onclick="closeM();newReflection()">Self Reflection</button><button class="btn secondary" onclick="closeM();newPlayer()">Player</button><button class="btn secondary" onclick="closeM();newAssessment()">Assessment</button><button class="btn secondary" onclick="closeM();newDrill()">Drill</button><button class="btn secondary" onclick="closeM();newMatch()">Match Note</button></div>`)}
function renderAll(){dashboard();sessions();reflections();players();assessments();drills();matches();reports()}nav();renderAll();
</script></body></html>
